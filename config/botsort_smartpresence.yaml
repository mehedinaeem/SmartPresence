# Keys verified against Ultralytics 8.4.138's packaged botsort.yaml.
tracker_type: botsort
# Classroom starting values, not ground-truth-optimized thresholds.
track_high_thresh: 0.45
track_low_thresh: 0.10  # Detector conf must not exceed this recovery floor.
new_track_thresh: 0.55
track_buffer: 120      # Consecutive processed frames; not seconds.
match_thresh: 0.80
fuse_score: true
gmc_method: none       # Fixed classroom camera; no camera-motion compensation.
proximity_thresh: 0.50
appearance_thresh: 0.85  # Conservative native-feature matching.
with_reid: true
model: auto            # YOLO11 native features; backend may fall back for other models.
