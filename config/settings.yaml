PROJECT_NAME: SmartPresence
FACE_SIZE:
  width: 160
  height: 160
ATTENDANCE_THRESHOLD: &attendance_threshold 0.75
EXPERIMENT_FRAME_INTERVAL_SECONDS: &experiment_interval 3
REALTIME_CCTV_FRAME_INTERVAL_SECONDS: 180
TRAIN_TEST_SPLIT: 0.20
RANDOM_STATE: 42
FACE_DETECTION:
  margin: 20
  min_size: 40
  min_sharpness: 20.0
PREPROCESSING:
  detector: mtcnn
  face_size:
    width: 160
    height: 160
  resize_mode: letterbox
  padding_value: [0, 0, 0]
  face_margin: 0.20
  detection_confidence: 0.90
  min_face_width: 40
  min_face_height: 40
  blur_check: true
  blur_threshold: 20.0
  brightness_check: true
  min_brightness: 20.0
  max_brightness: 240.0
  multiple_face_dominance_ratio: 1.75
  batch_size: 16
  orientation_fallback_degrees: [90]
RECOGNITION:
  model_name: Facenet
  embedding_dimension: 128
  svm_kernel: rbf
  svm_C: 10.0
  svm_gamma: scale
  svm_class_weight: balanced
  normalization: l2
  embedding_normalization: Facenet
  confidence_threshold: 0.50
TESTING:
  detector_backend: mtcnn
  align: true
  normalization: Facenet
  unknown_confidence_threshold: 0.55
  video_frame_interval_seconds: *experiment_interval
  attendance_threshold: *attendance_threshold
  show_preview: false
TRACKING:
  model: models/tracking/yolo11s.pt
  tracker: config/bytetrack_smartpresence.yaml
  person_class_id: 0
  confidence_threshold: 0.10
  stable_max_gap_frames: 120
  inference_size: 960
  show_preview: true
  sample_frame_count: 3

# Conservative visual continuity. These are starting values, not accuracy claims.
STABLE_IDENTITY:
  enabled: true
  max_missing_frames: 120
  max_reassociation_gap_frames: 120
  min_iou_for_reassociation: 0.30
  max_center_distance_ratio: 0.35
  min_size_ratio: 0.65
  max_size_ratio: 1.55
  overlap_iou_threshold: 0.20
  appearance_enabled: true
  appearance_similarity_threshold: 0.90
  appearance_history_size: 20
  min_appearance_samples: 2
  min_appearance_confidence: 0.45
  motion_enabled: true
  motion_prediction_frames: 5
  geometry_only_max_gap_frames: 2
  geometry_only_min_iou: 0.70
  geometry_only_max_center_distance_ratio: 0.15
